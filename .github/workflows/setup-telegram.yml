name: 1 - Setup Telegram notifications

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  setup-and-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate required configuration
        shell: bash
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          NOTIFY_WEBHOOK_SECRET: ${{ secrets.NOTIFY_WEBHOOK_SECRET }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          SUPABASE_PROJECT_REF: ${{ vars.SUPABASE_PROJECT_REF }}
          SUPABASE_URL: ${{ vars.SUPABASE_URL }}
        run: |
          set -euo pipefail
          for name in SUPABASE_ACCESS_TOKEN TELEGRAM_BOT_TOKEN NOTIFY_WEBHOOK_SECRET SUPABASE_ANON_KEY SUPABASE_PROJECT_REF SUPABASE_URL; do
            if [ -z "${!name:-}" ]; then
              echo "Missing GitHub secret or variable: $name" >&2
              exit 1
            fi
          done

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Store Edge Function secrets
        shell: bash
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          NOTIFY_WEBHOOK_SECRET: ${{ secrets.NOTIFY_WEBHOOK_SECRET }}
          SITE_BASE_URL: ${{ vars.SITE_BASE_URL }}
          TEACHER_TIME_ZONE: ${{ vars.TEACHER_TIME_ZONE }}
          SUPABASE_PROJECT_REF: ${{ vars.SUPABASE_PROJECT_REF }}
        run: |
          set -euo pipefail
          supabase secrets set \
            "TELEGRAM_BOT_TOKEN=$TELEGRAM_BOT_TOKEN" \
            "NOTIFY_WEBHOOK_SECRET=$NOTIFY_WEBHOOK_SECRET" \
            "SITE_BASE_URL=${SITE_BASE_URL:-}" \
            "TEACHER_TIME_ZONE=${TEACHER_TIME_ZONE:-Europe/Riga}" \
            --project-ref "$SUPABASE_PROJECT_REF"

      - name: Deploy notify-telegram
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ vars.SUPABASE_PROJECT_REF }}
        run: supabase functions deploy notify-telegram --project-ref "$SUPABASE_PROJECT_REF" --no-verify-jwt

      - name: Check Telegram connection
        shell: bash
        env:
          SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          NOTIFY_WEBHOOK_SECRET: ${{ secrets.NOTIFY_WEBHOOK_SECRET }}
          STUDENT_ID: ${{ vars.STUDENT_ID || 'amir' }}
        run: |
          set -euo pipefail
          endpoint="${SUPABASE_URL%/}/functions/v1/notify-telegram"
          http_code=$(curl --silent --show-error \
            --output telegram-check.json \
            --write-out '%{http_code}' \
            --request POST "$endpoint" \
            --header 'content-type: application/json' \
            --header "apikey: $SUPABASE_ANON_KEY" \
            --header "authorization: Bearer $SUPABASE_ANON_KEY" \
            --header "x-notify-secret: $NOTIFY_WEBHOOK_SECRET" \
            --data "{\"action\":\"telegram_connection_check\",\"studentId\":\"$STUDENT_ID\"}")

          jq '{ok, functionVersion, telegramReachable, telegramTokenConfigured, recipientConfigured, botUsername, chatType, messageThreadConfigured, error}' telegram-check.json

          if [ "$http_code" -lt 200 ] || [ "$http_code" -ge 300 ]; then
            echo "Telegram connection check failed with HTTP $http_code" >&2
            exit 1
          fi

          jq -e '.ok == true and .telegramReachable == true and .telegramTokenConfigured == true and .recipientConfigured == true' telegram-check.json >/dev/null
