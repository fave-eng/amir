<title id="title">Art gallery past continuous scenes</title><desc id="desc">Six clean panels showing actions at 5.30 yesterday: cleaning Gallery 6, trying to find the exit, closing windows, washing coffee cups, counting money, and a blank panel for the student.</desc>
